<div class="col-12 col-md-6 col-lg-4 mb-3">
    <label for="{{ form.nome.id_for_label }}" class="form-label">Nome:</label>
    {{ form.nome }}
</div>

<div class="col-12 col-md-6 col-lg-4 mb-3">
    <label for="{{ form.cpf.id_for_label }}" class="form-label">CPF:</label>
    {{ form.cpf }}
    {% for erro in form.cpf.errors %}
        <small>{{ erro }}</small>
    {% endfor %}
</div>

<div class="col-12 col-md-6 col-lg-4 mb-3">
    <label for="{{ form.telefone.id_for_label }}" class="form-label">Telefone:</label>
    {{ form.telefone }}
</div>

<div class="col-12 col-md-6 col-lg-4 mb-3">
    <label for="{{ form.email.id_for_label }}" class="form-label">E-mail:</label>
    {{ form.email }}
    {% for erro in form.email.errors %}
        <small>{{ erro }}</small>
    {% endfor %}
</div>

<div class="col-12 col-md-6 col-lg-4 mb-3">
    <label for="{{ form.data_nascimento.id_for_label }}" class="form-label">Data de Nascimento:</label>
    {{ form.data_nascimento }}
</div>

<div class="col-12 col-md-6 col-lg-4 mb-3">
    <label for="{{ form.sintomas.id_for_label }}" class="form-label">Sintomas:</label>
    {{ form.sintomas }}
</div>
